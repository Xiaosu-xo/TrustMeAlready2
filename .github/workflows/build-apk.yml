name: 自动打包 ARM64 Release APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 下载源码
        uses: actions/checkout@v4

      - name: 安装 Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: 准备 Android 环境
        uses: android-actions/setup-android@v3

      - name: 安装 Android 34
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: 只保留 ARM64
        run: |
          echo "打包前架构："
          find app/src/main/jniLibs -maxdepth 1 -mindepth 1 -type d -printf '%f\n'

          rm -rf app/src/main/jniLibs/armeabi-v7a
          rm -rf app/src/main/jniLibs/x86
          rm -rf app/src/main/jniLibs/x86_64

          echo "打包后架构："
          find app/src/main/jniLibs -maxdepth 1 -mindepth 1 -type d -printf '%f\n'

      - name: 给 Gradle 执行权限
        run: chmod +x gradlew

      - name: 编译 ARM64 Release
        run: ./gradlew assembleRelease --stacktrace

      - name: 创建签名证书
        run: |
          keytool -genkeypair \
            -keystore release.keystore \
            -storepass android \
            -keypass android \
            -alias release \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=TrustMeAlready2 ARM64"

      - name: 签名 APK
        run: |
          $ANDROID_HOME/build-tools/34.0.0/apksigner sign \
            --ks release.keystore \
            --ks-pass pass:android \
            --key-pass pass:android \
            --ks-key-alias release \
            --out TrustMeAlready2-v2.8.0-ARM64-Release.apk \
            app/build/outputs/apk/release/app-release-unsigned.apk

      - name: 检查 APK
        run: |
          $ANDROID_HOME/build-tools/34.0.0/apksigner verify \
            --verbose \
            TrustMeAlready2-v2.8.0-ARM64-Release.apk

          echo "APK 大小："
          ls -lh TrustMeAlready2-v2.8.0-ARM64-Release.apk

          echo "APK 中的 native 架构："
          unzip -l TrustMeAlready2-v2.8.0-ARM64-Release.apk | grep "lib/"

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: TrustMeAlready2-v2.8.0-ARM64-Release
          path: TrustMeAlready2-v2.8.0-ARM64-Release.apk
