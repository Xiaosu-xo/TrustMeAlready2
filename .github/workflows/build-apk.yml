name: 自动打包 Release APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 下载源码
        uses: actions/checkout@v4

      - name: 安装 Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: 准备 Android 环境
        uses: android-actions/setup-android@v3

      - name: 安装 Android 34
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: 给 Gradle 执行权限
        run: chmod +x gradlew

      - name: 编译 Release
        run: ./gradlew assembleRelease

      - name: 创建签名证书
        run: |
          keytool -genkeypair \
            -keystore release.keystore \
            -storepass android \
            -keypass android \
            -alias release \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=TrustMeAlready2"

      - name: 签名 Release APK
        run: |
          $ANDROID_HOME/build-tools/34.0.0/apksigner sign \
            --ks release.keystore \
            --ks-pass pass:android \
            --key-pass pass:android \
            --ks-key-alias release \
            --out TrustMeAlready2-release.apk \
            app/build/outputs/apk/release/app-release-unsigned.apk

      - name: 验证 APK 签名
        run: |
          $ANDROID_HOME/build-tools/34.0.0/apksigner verify \
            --verbose TrustMeAlready2-release.apk

      - name: 上传 Release APK
        uses: actions/upload-artifact@v4
        with:
          name: TrustMeAlready2-Release
          path: TrustMeAlready2-release.apk
